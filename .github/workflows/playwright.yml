name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Network Diagnostics
        run: |
          echo "======================================"
          echo "DNS"
          echo "======================================"
          getent hosts one.accuweather.com || true
          getent hosts www.accuweather.com || true

          echo ""
          echo "======================================"
          echo "AccuWeather Main Domain - IPv4"
          echo "======================================"
          curl -4 --http1.1 -v \
            --connect-timeout 10 \
            --max-time 20 \
            https://www.accuweather.com/ \
            -o /dev/null || true

          echo ""
          echo "======================================"
          echo "AccuWeather One - IPv4"
          echo "======================================"
          curl -4 --http1.1 -v \
            --connect-timeout 10 \
            --max-time 20 \
            https://one.accuweather.com/ \
            -o /dev/null || true

          echo ""
          echo "======================================"
          echo "AccuWeather One Onboarding - IPv4"
          echo "======================================"
          curl -4 --http1.1 -v \
            --connect-timeout 10 \
            --max-time 20 \
            https://one.accuweather.com/account/onboarding \
            -o /dev/null || true

          echo ""
          echo "======================================"
          echo "AccuWeather Main Domain - IPv6"
          echo "======================================"
          curl -6 --http1.1 -v \
            --connect-timeout 10 \
            --max-time 20 \
            https://www.accuweather.com/ \
            -o /dev/null || true

          echo ""
          echo "======================================"
          echo "AccuWeather One - IPv6"
          echo "======================================"
          curl -6 --http1.1 -v \
            --connect-timeout 10 \
            --max-time 20 \
            https://one.accuweather.com/ \
            -o /dev/null || true

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results / Traces / Videos on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7