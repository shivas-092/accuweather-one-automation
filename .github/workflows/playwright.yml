name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Check DNS and AccuWeather Connectivity
        run: |
          echo "======================================"
          echo "DNS Resolution"
          echo "======================================"

          getent hosts one.accuweather.com || true

          echo ""
          echo "======================================"
          echo "IPv4 Connectivity - HTTP/1.1"
          echo "======================================"

          curl -4 --http1.1 -I -L \
            --connect-timeout 10 \
            --max-time 30 \
            https://one.accuweather.com/ || true

          echo ""
          echo "======================================"
          echo "IPv6 Connectivity - HTTP/1.1"
          echo "======================================"

          curl -6 --http1.1 -I -L \
            --connect-timeout 10 \
            --max-time 30 \
            https://one.accuweather.com/ || true

          echo ""
          echo "======================================"
          echo "Onboarding URL - IPv4 HTTP/1.1"
          echo "======================================"

          curl -4 --http1.1 -I -L \
            --connect-timeout 10 \
            --max-time 30 \
            https://one.accuweather.com/account/onboarding || true

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results / Traces / Videos on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7